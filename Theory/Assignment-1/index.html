<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Notes App</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">

        <h1>📝 My Notes App</h1>
        <p class="subtitle">Write, save, and manage your notes</p>

        <div class="note-form">

            <input
                type="text"
                id="noteTitle"
                placeholder="Enter note title"
            >

            <textarea
                id="noteContent"
                placeholder="Write your note here..."
            ></textarea>

            <button id="addNoteBtn">Add Note</button>

            <p id="message"></p>

        </div>

        <h2>My Notes</h2>

        <div id="notesContainer" class="notes-container"></div>

        <p id="emptyMessage">No notes yet. Add your first note!</p>

    </div>

    <script src="script.js"></script>

</body>
</html>
