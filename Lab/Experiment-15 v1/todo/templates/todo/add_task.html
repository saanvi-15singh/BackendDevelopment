<!DOCTYPE html>
<html>
<head>
    <title>Add Task</title>
</head>
<body>
    <h1>Add a New Task</h1>

    <form method="POST">
        {% csrf_token %}

        <label for="title">Task Name:</label>
        <input
            type="text"
            id="title"
            name="title"
            placeholder="Enter your task"
            required
        >

        <button type="submit">Add Task</button>
    </form>

    <br>

    <a href="{% url 'task_list' %}">Back to List</a>
</body>
</html>
